substitutions:
  _REGION: us-east4
  _REPO: gcp-demo
  _CLUSTER: gke-lab-cluster
  _PROJECT: gcp-demo-2026

options:
  logging: CLOUD_LOGGING_ONLY

steps:
- name: 'gcr.io/cloud-builders/docker'
  args:
    [
      'build', '-t', '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/flask-app:$SHORT_SHA', 'app'
    ]

- name: 'gcr.io/cloud-builders/docker'
  args:
    [
      'push', '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/flask-app:$SHORT_SHA'
    ]

- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: 'bash'
  args:
    - -c
    - |
      sed "s#IMAGE_URL#$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/flask-app:$SHORT_SHA#g" Manifests/deployment.yaml > Manifests/deployment.tmp.yaml
      gcloud container clusters get-credentials $_CLUSTER --project $_PROJECT --dns-endpoint
      kubectl apply -f Manifests/deployment.tmp.yaml
      kubectl apply -f Manifests/service.yaml

images:
- '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/flask-app:$SHORT_SHA'

